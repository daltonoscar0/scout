[project]
name = "scout"
version = "0.1.0"
description = "Player similarity, projection and valuation from open football event data"
requires-python = ">=3.11"

# The dependency split is load-bearing, not cosmetic.
#
# The base install is what the *query path* needs: CLI, similarity search,
# Streamlit app, Excel export. It must stay free of torch, lightgbm and faiss.
# Importing torch costs 2-4s cold, which alone would eat most of the <5s
# latency budget, and torch + faiss abort the process outright (both vendor
# their own libomp; the collision is rc=134 in either import order, and
# KMP_DUPLICATE_LIB_OK turns the clean abort into a segfault).
#
# Training and model fitting live in extras, and run as separate processes.
#
# sportio is deliberately NOT a base dependency. It is an editable path
# dependency on a sibling checkout, so `uv sync` in a clone anywhere else fails
# with "Distribution not found" before anything can run -- which broke the
# spec's own acceptance criterion, "fresh clone + scout demo works offline".
# Only the corpus rebuild needs it; the query path touches it solely to print a
# version string, and does so defensively.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "rapidfuzz>=3.9",
    "requests>=2.32",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "streamlit>=1.38",
    "altair>=5.4",
]

[project.optional-dependencies]
# `scout train` / `scout embed` only. Never imported by the query path.
train = ["torch>=2.4"]
# `scout fit-value` only. Never imported in the same process as torch.
#
# scikit-learn rather than LightGBM. lightgbm's dylib links @rpath/libomp.dylib
# and resolves it through Homebrew, so it imports on a machine that happens to
# have `brew install libomp` and fails on a clean Mac or a CI runner with an
# error the user cannot act on. sklearn vendors its own OpenMP and needs no
# non-pip prerequisite. HistGradientBoostingRegressor is the same algorithm
# family, and on a few thousand rows the accuracy difference is not worth an
# install-time failure.
models = ["scikit-learn>=1.5"]

[project.scripts]
scout = "scout.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

# NOTE: sportio is deliberately absent from [project.dependencies], from every
# extra, and from [tool.uv.sources]. It is an editable checkout of a sibling
# repo, and uv resolves a path source even when the package sits in an extra --
# so merely declaring it makes `uv sync` fail in any clone that does not happen
# to have ../sportio beside it. That broke "fresh clone + scout demo works
# offline", which is the spec's hardest acceptance criterion.
#
# Install it explicitly when rebuilding the corpus:
#     uv pip install -e ../sportio
# Nothing on the query path needs it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits the network; deselect with -m 'not network'",
    "slow: takes more than a few seconds",
]
